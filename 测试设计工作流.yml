        - id: 8e9cc062-cfc6-45df-8079-c46387479b53
          role: system
          text: 你是一名软件测试专家，你能够读取需求文档，根据需求描述生成测试设计
        - id: 0d4a863e-1a07-43a5-9ed9-832504566fd3
          role: user
          text: '我需要你读取{{#1763560315679.text#}}，并根据文档内容生成测试用例。


            其中每一条测试用例包含测试步骤、预期结果，测试用例类型包含功能用例、稳定性用例、兼容性用例、易用性测试用例、安全测试用例等。


            测试设计要以markdown格式输出，且要能够复制到markdown文件中直接可以解析


            输出内容不要包含思考过程！

            输出内容不要包含思考过程！

            输出内容不要包含思考过程！


            下面我给出测试设计的示例，必须按照示例输出用例


            "

            # 购物车功能测试用例


            ## 加入购物车


            ### 用例标题: 单次加入超出购物车数量限制


            #### 用例步骤


            - 1、登录并进入商品界面。


            - 2、点击“加入购物车”按钮添加商品至购物车，输入超过200件的商品数量(如:201)。


            - 3、观察系统响应。


            #### 预期结果


            - 3、系统不接受超过200件的添加请求，并提示用户“最多200件”。


            ### 用例标题: 往购物出加入一件商品


            #### 用例步骤


            - 1、登录并进入商品界面。


            - 2、点击“加入购物车”按钮添加商品至购物车，输入数量为1。


            - 3、观察系统响应。


            #### 预期结果


            - 3、加入购物车成功，并弹出成功字样。


            ## 删除购物车


            ### 用例标题: 删除购物车一件商品


            #### 用例步骤


            - 1、登录并进入购物车界面。


            - 2、选中一件商品，点击删除


            #### 预期结果


            - 2、购物车商品少了一件


            ### 用例标题: 批量删除购物车商品


            #### 用例步骤


            - 1、登录并进入购物车界面。


            - 2、选中多件商品，点击删除


            #### 预期结果


            - 2、购物车商品少了第2步选中数量的商品

            "'
