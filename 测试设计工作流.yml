    - data:
        code: "import re\nfrom typing import Dict, Any\n\n\ndef main(arg1: str) ->\
          \ Dict[str, str]:\n    \"\"\"\n    将Markdown格式的文本转换为XMind能识别的格式\n\n    Args:\n\
          \        arg1: Markdown格式的字符串\n\n    Returns:\n        包含转换后结果的字典\n    \"\
          \"\"\n    try:\n        # 清理Markdown文本\n        markdown_text = arg1.strip()\n\
          \n        # 解析Markdown结构\n        lines = markdown_text.split('\\n')\n \
          \       xmind_structure = []\n        stack = []  # 用于跟踪当前层级\n\n       \
          \ for line in lines:\n            line = line.strip()\n            if not\
          \ line:\n                continue\n\n            # 处理标题 (# 二级标题 ## 三级标题等)\n\
          \            title_match = re.match(r'^(#+)\\s+(.+)$', line)\n         \
          \   if title_match:\n                level = len(title_match.group(1)) \
          \ # #的数量表示层级\n                title = title_match.group(2).strip()\n\n \
          \               # 调整堆栈以匹配当前层级\n                while stack and stack[-1]['level']\
          \ >= level:\n                    stack.pop()\n\n                node = {\n\
          \                    'title': title,\n                    'level': level,\n\
          \                    'children': []\n                }\n\n             \
          \   if stack:\n                    stack[-1]['children'].append(node)\n\
          \                else:\n                    xmind_structure.append(node)\n\
          \n                stack.append(node)\n\n            # 处理列表项 (- 或 * 开头)\n\
          \            elif re.match(r'^[-*]\\s+.+', line):\n                if not\
          \ stack:\n                    # 如果没有标题，创建根节点\n                    root_node\
          \ = {'title': '根节点', 'level': 1, 'children': []}\n                    xmind_structure.append(root_node)\n\
          \                    stack.append(root_node)\n\n                # 列表项作为当前标题的子节点\n\
          \                list_match = re.match(r'^[-*]\\s+(.+)$', line)\n      \
          \          if list_match:\n                    list_item = {\n         \
          \               'title': list_match.group(1).strip(),\n                \
          \        'level': stack[-1]['level'] + 1,\n                        'children':\
          \ []\n                    }\n                    stack[-1]['children'].append(list_item)\n\
          \n        # 如果没有解析到任何结构，返回原始文本\n        if not xmind_structure:\n      \
          \      return {\n                \"result\": arg1,\n                \"message\"\
          : \"未检测到有效的Markdown结构，返回原始文本\",\n                \"structure_type\": \"\
          raw_text\"\n            }\n\n        # 转换为XMind兼容的文本格式\n        def build_xmind_text(nodes,\
          \ indent=0):\n            result = []\n            for node in nodes:\n\
          \                indent_str = '\\t' * (node['level'] - 1)\n            \
          \    result.append(f\"{indent_str}{node['title']}\")\n                if\
          \ node['children']:\n                    result.extend(build_xmind_text(node['children'],\
          \ indent + 1))\n            return result\n\n        xmind_text_lines =\
          \ build_xmind_text(xmind_structure)\n        xmind_result = '\\n'.join(xmind_text_lines)\n\
          \n        return {\n            \"result\": xmind_result\n        }\n\n\
          \    except Exception as e:\n        return {\n            \"result\": arg1,\n\
          \            \"message\": f\"转换过程中发生错误: {str(e)}\",\n            \"structure_type\"\
          : \"raw_text\",\n            \"error\": True\n        }\n\n\ndef _flatten_structure(nodes):\n\
          \    \"\"\"将层级结构扁平化\"\"\"\n    result = []\n    for node in nodes:\n   \
          \     result.append(node)\n        if node['children']:\n            result.extend(_flatten_structure(node['children']))\n\
          \    return result"
